name: Firmware Info
description: Checks an embedded firmware ELF file and reports its size

inputs:
  elf-file:
    description: Path to the ELF file
    required: true

  mcu:
    description: Target microcontroller
    required: true

  build-type:
    description: CMake build type
    required: true

outputs:
  file-size:
    description: ELF file size in bytes

runs:
  using: node24
  main: dist/index.js