name: Embedded CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        mcu:
        - stm32f103c8
        - stm32f407vg
        - stm32h743zi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          arm-none-eabi-gcc --version

      - name: Configure CMake
        run: |
          cmake -S . -B build-${{ matrix.mcu }}-${{ matrix.build_type }} \
            -DMCU=${{ matrix.mcu }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/arm-none-eabi.cmake

      - name: Build firmware
        run: |
          cmake --build build-${{ matrix.mcu }}-${{ matrix.build_type }}